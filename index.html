<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>HVL</title>
</head>
<body>
    
    <div class="blank">

    </div>

    <div class="main-function">
        <div class="sidebar">
            <button class="main">Trang chủ</button>
            <button class="playlist">Danh sách</button>
            <button class="library">Thư viện</button>
        </div>

        <div class="main-stream">
            <div class="introduction">
                <img src="../Image/mck.webp">
            </div>

            <div class="full-playlist">
                <button>Phát tất cả</button>
            </div>

            <div class="music">
                <h2>Tất cả bài hát</h2>
                <pre>#     Tên bài hát</pre>

                <div class="track" onclick="playtrack()">
                    <div class="left-side">
                        <span class="track-number">1.</span>
                        <span class="play-button">▶</span>
                    </div>

                    <div class="song-info">
                        <p class="track-name">Elegie</p>
                        <p class="artist">RPT MCK</p>
                    </div>

                    <button class="save">+</button>
                    <span class="duration">1:24</span>
                    <button class="more-option">⋯</button>
                </div>


            </div>
        </div>

        <div class="info">
            <h2>Thông tin nghệ sĩ</h2>
                <div class="info-inside">

                </div>
            <button>Phát playlist</button>
        </div>

        </div>
    </div>
    
    <div class="blank">

    </div>
</body>
</html>
